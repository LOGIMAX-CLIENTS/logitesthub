# Staging answers for:  sudo bash setup-server.sh --instance staging --config staging.conf
# Copy to staging.conf, fill the empty values, run, then DELETE it (it holds passwords): shred -u staging.conf
# --instance staging keeps staging separate from prod: service logitesthub-staging,
# /etc/logitesthub-staging, its own app port, database and Apache site.
# Both instances share Apache's port 80; the ALB and Apache tell them apart by DOMAIN.

APP_USER=ubuntu
INSTALL_DIR=/var/www/logitesthub/staging
TIMEZONE=Asia/Kolkata
APP_PORT=5051
NGINX_PORT=80                     # shared with prod and the existing Apache sites; told apart by DOMAIN

GITHUB_REPO=LOGIMAX-CLIENTS/logitesthub
GITHUB_BRANCH=staging
GITHUB_TOKEN=                     # github_pat_...  (Contents: Read-only on this repo)

DB_MODE=rds
RDS_HOST=staging-pm-logimax-db.cdk8wggounv9.ap-south-1.rds.amazonaws.com
RDS_PORT=3306
RDS_MASTER_USER=admin_stage_pm    # empty = database + app user already exist
RDS_MASTER_PASSWORD=
DB_NAME=logitesthub_staging
DB_USER=logitesthub_staging
DB_PASSWORD=                      # empty = keep the password already on the server

PM_DB_HOST=                       # optional: PM sign-in (Unified_DB, read-only user)
PM_DB_PORT=3306
PM_DB_NAME=Unified_DB
PM_DB_USER=
PM_DB_PASSWORD=

DOMAIN=lthuat.logimaxindia.com    # CNAME -> erp-prod-alb-1887244842.ap-south-1.elb.amazonaws.com
SSL_MODE=alb                      # the ALB holds the ACM certificate and forwards HTTP to port 80
CERTBOT_EMAIL=

ANTHROPIC_API_KEY=                # sk-ant-... ; empty = keep the key already on the server
ADMIN_USERNAME=admin
ADMIN_NAME=Administrator
ADMIN_PASSWORD=                   # empty = skip (admin already exists)
WEB_SERVER=apache                 # Apache already runs on this server
