# Production answers for:  sudo bash setup-server.sh --config prod.conf
# Copy to prod.conf, fill the empty values, run, then DELETE it (it holds passwords): shred -u prod.conf
# No --instance for prod: service logitesthub, /etc/logitesthub, app port 5050.
# Anything left empty is asked on screen. Secrets are never saved by the script.

APP_USER=ubuntu
INSTALL_DIR=/var/www/logitesthub/prod
TIMEZONE=Asia/Kolkata
APP_PORT=5050
NGINX_PORT=80                     # shared with the existing Apache sites; told apart by DOMAIN

GITHUB_REPO=LOGIMAX-CLIENTS/logitesthub
GITHUB_BRANCH=prod
GITHUB_TOKEN=                     # github_pat_...  (Contents: Read-only on this repo)

DB_MODE=rds
RDS_HOST=staging-pm-logimax-db.cdk8wggounv9.ap-south-1.rds.amazonaws.com
RDS_PORT=3306
RDS_MASTER_USER=admin_stage_pm    # empty = database + app user already exist
RDS_MASTER_PASSWORD=
DB_NAME=logitesthub
DB_USER=logitesthub
DB_PASSWORD=                      # empty on the first run = generated

PM_DB_HOST=                       # optional: PM sign-in (Unified_DB, read-only user)
PM_DB_PORT=3306
PM_DB_NAME=Logimax
PM_DB_USER=
PM_DB_PASSWORD=

DOMAIN=lth.logimaxindia.com       # CNAME -> erp-prod-alb-1887244842.ap-south-1.elb.amazonaws.com
SSL_MODE=alb                      # the ALB holds the ACM certificate and forwards HTTP to port 80
CERTBOT_EMAIL=

ANTHROPIC_API_KEY=                # sk-ant-... ; empty = AI steps off
ADMIN_USERNAME=admin
ADMIN_NAME=Administrator
ADMIN_PASSWORD=                   # min 8 chars ; empty = skip (admin already exists)
WEB_SERVER=apache                 # Apache already runs on this server
