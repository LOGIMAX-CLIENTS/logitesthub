# Answers for:  sudo bash setup-server.sh --config setup.conf
# Copy to setup.conf, fill in, run, then DELETE setup.conf (it holds passwords): shred -u setup.conf
# Anything left empty is asked on screen. Secrets are never saved by the script.

APP_USER=ubuntu
INSTALL_DIR=/opt/logitesthub
TIMEZONE=Asia/Kolkata
APP_PORT=5050

GITHUB_REPO=LOGIMAX-CLIENTS/logitesthub
GITHUB_BRANCH=main
GITHUB_TOKEN=                     # github_pat_...  (Contents: Read-only on this repo)

DB_MODE=rds                       # rds | local
RDS_HOST=                         # xxx.yyy.ap-south-1.rds.amazonaws.com
RDS_PORT=3306
RDS_MASTER_USER=admin             # empty = database + app user already exist
RDS_MASTER_PASSWORD=
DB_NAME=logitesthub
DB_USER=logitesthub
DB_PASSWORD=                      # empty on the first run = generated

PM_DB_HOST=                       # optional: PM sign-in (Unified_DB, read-only user)
PM_DB_PORT=3306
PM_DB_NAME=Unified_DB
PM_DB_USER=
PM_DB_PASSWORD=

DOMAIN=                           # e.g. tester.logimaxindia.com ; empty = no domain
SSL_MODE=alb                      # alb | certbot | none
CERTBOT_EMAIL=

ANTHROPIC_API_KEY=                # sk-ant-... ; empty = AI steps off
ADMIN_USERNAME=admin
ADMIN_NAME=Administrator
ADMIN_PASSWORD=                   # min 8 chars ; empty = skip (admin already exists)
