      <stop offset="0" stop-color="#3b5bff"/><stop offset=".35" stop-color="#8b2cf5"/>
      <stop offset=".68" stop-color="#ff2d8f"/><stop offset="1" stop-color="#ffa21f"/>
    </linearGradient>
    <linearGradient id="ls" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b2cf5" stop-opacity="0"/><stop offset="1" stop-color="#ff2d8f"/>
